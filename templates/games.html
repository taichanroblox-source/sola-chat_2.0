<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLA GAME CENTER</title><link rel="stylesheet" href="/static/game-center.css?v=20261105-v49"></head><body><header><button type="button" class="back" data-return-chat>← SOLA CHATに戻る</button><h1>🌅 SOLA GAME CENTER</h1><p>6種類のゲームで遊ぼう！ · ゲームセンター v44</p></header><main><nav class="tabs"><button data-filter="all" class="active">すべて</button><button data-filter="solo">1人用</button><button data-filter="multi">対戦</button><button data-filter="ranking">🏆 ランキング</button></nav><section id="cards" class="cards"></section><section id="sola-rankings" class="rankings" hidden><div class="rank-head"><h2>🏆 ランキング <small>ゲームの記録をチェック！</small></h2><div class="rank-controls"><label for="sola-rank-game">ゲーム</label><select id="sola-rank-game"><option value="snake">🐍 スネーク</option><option value="2048">🔢 2048</option><option value="breakout">🧱 ブロック崩し</option><option value="ttt">❌ ○×ゲーム</option><option value="connect4">🔴 四目並べ</option><option value="reversi">⚫ リバーシ</option></select><select id="sola-rank-period"><option value="all">全期間</option><option value="month">過去30日</option><option value="week">過去7日</option></select><select id="sola-rank-scope"><option value="all">全体</option></select><button id="sola-rank-refresh" type="button">🔄 更新</button></div></div><div id="sola-rank-body" aria-live="polite">ランキングを読み込み中…</div></section><section id="play" hidden><div class="top"><button id="home">⌂ ホーム</button><strong id="game-title"></strong><span id="score"></span></div><div id="board"></div><p id="hint"></p><div id="touch" hidden><button data-dir="ArrowUp">↑</button><div><button data-dir="ArrowLeft">←</button><button data-dir="ArrowDown">↓</button><button data-dir="ArrowRight">→</button></div></div></section></main><div id="pause" class="overlay" hidden><div class="dialog"><h2>⏸ 一時停止中</h2><p>動きとタイマーは停止しているよ</p><button id="resume">▶ 再開する</button><button id="to-list">🎮 ゲーム選択に戻る</
