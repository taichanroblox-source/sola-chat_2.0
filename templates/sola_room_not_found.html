<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f3">
  <title>グループが見つからない | SOLA CHAT</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:radial-gradient(ellipse at 10% 15%,#fff2e9 0%,transparent 46%),radial-gradient(ellipse at 90% 80%,#f7e0ed 0%,transparent 50%),#fff9f7; color:#654050; display:flex; flex-direction:column; }
    header { width:min(100%,1100px); margin:0 auto; padding:26px clamp(20px,4vw,46px); display:flex; align-items:center; gap:12px; }
    .logo { width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#f5a17a,#c65b8b 64%,#7157a5); display:grid;place-items:center;color:white;font-weight:900;font-size:18px;box-shadow:0 6px 17px #c7779650; }
    header strong { color:#a4466e; font-size:19px;letter-spacing:.03em; }
    main { flex:1; display:grid; place-items:center; padding:22px 18px 75px; }
    .panel { width:min(100%,480px); padding:clamp(26px,5vw,44px); background:rgba(255,255,255,.92); border:1px solid #efd2d7; border-radius:28px; text-align:center; box-shadow:0 20px 65px #a75b7530; }
    .lock { width:78px;height:78px;display:grid;place-items:center;margin:0 auto 20px;border-radius:24px;background:linear-gradient(145deg,#ffe4d7,#f6d9e7);font-size:37px; }
    h1 { font-size:clamp(21px,4vw,27px);line-height:1.5;color:#8c3f60;margin:0 0 14px; }
    p { font-size:14px;line-height:1.9;color:#866b76;margin:0 0 26px; }
    .actions { display:flex;flex-direction:column;gap:10px; }
    a { display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;border-radius:14px;min-height:48px;font-size:15px;font-weight:700;transition:filter .15s ease; }
    a:hover { filter:brightness(.97); }
    a:focus-visible { outline:3px solid #8f5ad1;outline-offset:3px; }
    .home { color:white;background:linear-gradient(110deg,#f49a7c,#cf618d);box-shadow:0 8px 17px #d77b9140; }
    .join { color:#9c4e70;background:#fff0eb;border:1px solid #f1d7d7; }
    .foot { margin-top:22px;font-size:12px;color:#ac8a96; }
    @media (prefers-reduced-motion: reduce) { a { transition:none; } }
  </style>
</head>
<body>
  <header><div class="logo" aria-hidden="true">S</div><strong>SOLA CHAT</strong></header>
  <main>
    <section class="panel" aria-labelledby="denied-title">
      <div class="lock" aria-hidden="true">🔎</div>
      <h1 id="denied-title">グループが<br>見つからないよ</h1>
      <p>グループIDが間違っているか、<br>グループが削除された可能性があるよ。<br>URLをもう一度確認してみてね。</p>
      <nav class="actions" aria-label="移動先">
        <a class="home" href="/home">⌂ ホームに戻る</a>
      </nav>
      <div class="foot">グループIDを確認して、もう一度試してね。</div>
    </section>
  </main>
</body>
</html>
